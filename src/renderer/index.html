<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' https: data: blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; font-src 'self' data:"
    />
    <title>Rondelle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="tb-brand">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="tb-app">Rondelle</span>
      </div>

      <button id="team-chip" class="team-chip" data-tip="Équipe suivie : cliquez pour en changer">
        <span class="team-chip-logo"></span><span class="team-chip-name"></span>
      </button>

      <div id="game-pill" class="game-pill" data-tip="Score et temps tels que vus sur votre écran (zéro divulgâcheur)">
        <span class="muted">Recherche du match…</span>
      </div>

      <div class="tb-sep"></div>

      <div id="source-web" class="source-group">
        <button id="btn-prev" class="icon-btn" data-tip="Stream précédent" data-kbd="P" aria-label="Stream précédent"><svg class="ic"><use href="/vendor/icons.svg#i-chevron-left"></use></svg></button>
        <label class="stream-select" data-tip="Streams trouvés pour le match">
          <span id="stream-health" class="status-dot"></span>
          <select id="stream-select" aria-label="Choisir un stream"></select>
          <svg class="ic"><use href="/vendor/icons.svg#i-chevron-down"></use></svg>
        </label>
        <button id="btn-next" class="icon-btn" data-tip="Stream suivant" data-kbd="N" aria-label="Stream suivant"><svg class="ic"><use href="/vendor/icons.svg#i-chevron-right"></use></svg></button>
        <button id="btn-home" class="icon-btn" data-tip="Revenir à la page des matchs" aria-label="Page des matchs"><svg class="ic"><use href="/vendor/icons.svg#i-house"></use></svg></button>
        <button id="btn-refresh-streams" class="icon-btn" data-tip="Relire la liste des streams" aria-label="Relire la liste"><svg class="ic"><use href="/vendor/icons.svg#i-refresh-cw"></use></svg></button>
      </div>

      <div id="source-overlay" class="source-group" hidden>
        <span class="status-chip"><span id="ov-dot" class="status-dot warn pulse"></span><span id="ov-label">Surcouche</span></span>
      </div>

      <div class="spacer"></div>

      <button id="mode-pill" class="status-chip" data-tip="Ce que la régie voit : match ou pause publicitaire. Cliquez pour forcer un mode." data-kbd="M">
        <span class="mode-dot status-dot unknown"></span><span id="mode-label">Pub : ?</span>
      </button>
      <div id="sync-pill" class="status-chip" data-tip="Synchronisation avec le direct">
        <svg class="ic"><use href="/vendor/icons.svg#i-timer"></use></svg><span>Sync —</span>
      </div>

      <div class="tb-sep"></div>

      <button id="btn-theatre" class="icon-btn" data-tip="Mode théâtre : le lecteur seul, plein cadre" data-kbd="T" aria-label="Mode théâtre"><svg class="ic"><use href="/vendor/icons.svg#i-rectangle-horizontal"></use></svg></button>
      <button id="btn-calibrate" class="icon-btn" data-tip="Calibrer le tableau de score du diffuseur" data-kbd="C" aria-label="Calibrer"><svg class="ic"><use href="/vendor/icons.svg#i-scan"></use></svg></button>
      <button id="btn-fullscreen" class="icon-btn" data-tip="Plein écran" data-kbd="F" aria-label="Plein écran"><svg class="ic"><use href="/vendor/icons.svg#i-expand"></use></svg></button>
      <button id="btn-settings" class="icon-btn" data-tip="Réglages" data-kbd="S" aria-label="Réglages"><svg class="ic"><use href="/vendor/icons.svg#i-settings"></use></svg></button>
    </header>

    <main id="stage">
      <webview id="stream" partition="persist:stream" src="about:blank" allowpopups></webview>
      <section id="control" class="control" hidden></section>
      <div id="hotzone"></div>

      <div id="overlay" aria-live="polite">
        <div id="fx-tension"></div>
        <div id="banner" class="banner"></div>
        <div id="feed" class="feed"></div>
        <div id="jail-cells" class="jail-cells"></div>
        <div id="jail" class="jail"></div>
        <div id="adshow" class="adshow"></div>
        <div id="sad-goal" class="sad-goal"><canvas id="rain"></canvas></div>
        <div id="celebration" class="celebration"><canvas id="confetti"></canvas></div>
        <pre id="hud" class="hud"></pre>
      </div>
    </main>

    <div id="toasts" aria-live="polite"></div>
    <div id="settings" class="dialog-backdrop" hidden></div>
    <div id="welcome" class="dialog-backdrop" hidden></div>
    <div id="calibration" class="modal" hidden></div>
    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
