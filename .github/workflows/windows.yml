name: Windows

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-audio.mjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Rondelle-Windows
          path: dist/*.exe
          if-no-files-found: error
      # Version taguée (v1.2.3) : installateur et portable publiés dans une release GitHub,
      # que Rondelle propose ensuite en mise à jour
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
