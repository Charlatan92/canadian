<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fake player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #player { position: relative; width: 100vw; height: 100vh; }
  video { width: 100%; height: 100%; }
  #play { position: absolute; inset: 0; z-index: 1000; background: transparent; border: 0; cursor: pointer; }
  #trap { position: fixed; inset: 0; z-index: 2147483647; opacity: 0; }
</style></head>
<body>
  <div id="player">
    <video id="v" playsinline></video>
    <!-- Gros bouton lecture transparent (icône SVG, pas de texte), comme la plupart des lecteurs -->
    <button id="play" aria-label="play"><svg width="120" height="120" viewBox="0 0 10 10"><path d="M3 2 L8 5 L3 8 Z" fill="#fff"/></svg></button>
  </div>
  <!-- Calque piège : le 1er clic ouvre un pop-under, puis le calque disparaît -->
  <div id="trap"></div>
  <canvas id="c" width="640" height="360" style="display:none"></canvas>
  <script>
    const trap = document.getElementById('trap');
    trap.addEventListener('click', () => {
      const w = window.open('http://ads.invalid/popunder');
      w.blur(); // plante si window.open renvoie null : le lecteur ne démarre jamais
      window.focus();
      trap.remove();
      window.trapDone = true;
    });
    document.getElementById('play').addEventListener('click', () => {
      const c = document.getElementById('c');
      const ctx = c.getContext('2d');
      let t = 0;
      (function draw() {
        t++;
        ctx.fillStyle = `hsl(${t % 360}, 60%, 40%)`;
        ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = '#fff';
        ctx.fillRect((t * 7) % 640, 150, 60, 60);
        requestAnimationFrame(draw);
      })();
      const v = document.getElementById('v');
      v.srcObject = c.captureStream(25);
      v.play();
      document.getElementById('play').remove();
      window.playing = true;
    });
  </script>
</body>
</html>
